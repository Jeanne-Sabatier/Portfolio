<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vidéos</title>
    <link rel="stylesheet" href="video_page.css" />
    <link
      rel="icon"
      href="/Images/Fraise_icon.jpeg"
      type="image/jpeg"
    />
  </head>
  <body>
    <a href="/index.html" class="return-home">← Retour</a>
    <div class="app">
      <aside class="sidebar" aria-label="Catégories">
        <div class="logo">BouTV</div>
        <nav class="categories" role="navigation">
          <button class="cat active" data-cat="all">Toutes</button>
          <button class="cat" data-cat="1">Catégorie 1</button>
          <button class="cat" data-cat="2">Catégorie 2</button>
          <button class="cat" data-cat="3">Catégorie 3</button>
        </nav>
      </aside>

      <main class="main">
        <section class="player-area">
          <div class="video-wrapper">
            <iframe
              id="player"
              width="100%"
              height="600"
              src=""
              title="Lecteur vidéo"
              frameborder="0"
              allow="
                accelerometer;
                autoplay;
                clipboard-write;
                encrypted-media;
                gyroscope;
                picture-in-picture;
                web-share;
              "
              allowfullscreen
            >
            </iframe>
          </div>
          <h2 id="video-title">Big Buck Bunny</h2>
          <p class="meta">
            Catégorie : <strong id="video-category">Toutes</strong>
          </p>
        </section>

        <section class="recommendations">
          <h3>Autres vidéos</h3>
          <div class="slots" id="slots" aria-label="Autres vidéos">
            <!-- slots populated by JS -->
          </div>
        </section>
      </main>
    </div>

    <script src="video_page.js"></script>
  </body>
</html>
